<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
  <title>Change Password</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-5 mb-5">

  <!-- Breadcrumb -->
  <div class="row mb-4">
    <div class="col-lg-12">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            <a th:href="@{/dashboard}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">
            Change Password
          </li>
        </ol>
      </nav>

      <h1 class="display-6">
        <i class="bi bi-key-fill"></i> Change Password
      </h1>
    </div>
  </div>

  <!-- Card -->
  <div class="row justify-content-center">
    <div class="col-lg-6">

      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">
            <i class="bi bi-lock-fill"></i> Security Settings
          </h5>
        </div>

        <div class="card-body">

          <!-- Global error -->
          <div th:if="${error}"
               class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"></button>
          </div>

          <form th:action="@{/user/change-password}"
                method="post"
                th:object="${passwordDTO}">

            <!-- Old password -->
            <div class="mb-3">
              <label class="form-label">
                <i class="bi bi-shield-lock-fill"></i> Old Password *
              </label>
              <input type="password"
                     class="form-control"
                     th:field="*{oldPassword}"
                     th:classappend="${#fields.hasErrors('oldPassword')} ? 'is-invalid' : ''"
                     required>

              <div class="invalid-feedback"
                   th:if="${#fields.hasErrors('oldPassword')}"
                   th:errors="*{oldPassword}">
              </div>
            </div>

            <!-- New password -->
            <div class="mb-3">
              <label class="form-label">
                <i class="bi bi-key-fill"></i> New Password *
              </label>
              <input type="password"
                     class="form-control"
                     th:field="*{newPassword}"
                     th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                     required>

              <div class="invalid-feedback"
                   th:if="${#fields.hasErrors('newPassword')}"
                   th:errors="*{newPassword}">
              </div>

              <small class="text-muted">
                Must contain uppercase, lowercase, number & special character
              </small>
            </div>

            <!-- Confirm -->
            <div class="mb-3">
              <label class="form-label">
                <i class="bi bi-check-circle-fill"></i> Confirm Password *
              </label>
              <input type="password"
                     class="form-control"
                     th:field="*{confirmPassword}"
                     th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                     required>

              <div class="invalid-feedback"
                   th:if="${#fields.hasErrors('confirmPassword')}"
                   th:errors="*{confirmPassword}">
              </div>
            </div>

            <hr>

            <!-- Buttons -->
            <div class="d-flex justify-content-end gap-2">
              <a th:href="@{/dashboard}"
                 class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancel
              </a>

              <button type="submit"
                      class="btn btn-primary">
                <i class="bi bi-check-circle-fill"></i> Update Password
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
