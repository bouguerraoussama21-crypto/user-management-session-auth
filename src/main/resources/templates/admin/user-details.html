<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>User Details</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-5 mb-5">
    <div class="row mb-4">
        <div class="col-lg-12">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/users}">Users</a></li>
                    <li class="breadcrumb-item active" aria-current="page">User Details</li>
                </ol>
            </nav>
            <h1 class="display-6">
                <i class="bi bi-person-circle"></i> User Details
            </h1>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Personal Information</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-3 fw-bold">ID:</div>
                        <div class="col-md-9" th:text="${user.id}"></div>
                    </div>
                    <hr>
                    <div class="row mb-3">
                        <div class="col-md-3 fw-bold">Username:</div>
                        <div class="col-md-9">
                            <i class="bi bi-person-fill"></i>
                            <span th:text="${user.userName}"></span>
                        </div>
                    </div>
                    <hr>
                    <div class="row mb-3">
                        <div class="col-md-3 fw-bold">Email:</div>
                        <div class="col-md-9">
                            <i class="bi bi-envelope-fill"></i>
                            <span th:text="${user.email}"></span>
                        </div>
                    </div>
                    <hr>
                    <div class="row mb-3">
                        <div class="col-md-3 fw-bold">First Name:</div>
                        <div class="col-md-9" th:text="${user.firstName}"></div>
                    </div>
                    <hr>
                    <div class="row mb-3">
                        <div class="col-md-3 fw-bold">Last Name:</div>
                        <div class="col-md-9" th:text="${user.lastName}"></div>
                    </div>
                    <hr>
                    <div class="row mb-3">
                        <div class="col-md-3 fw-bold">Roles:</div>
                        <div class="col-md-9">
                            <span class="badge bg-primary me-1" th:each="role : ${user.roles}" th:text="${role}"></span>
                        </div>
                    </div>
                    <hr>
                    <div class="row mb-3">
                        <div class="col-md-3 fw-bold">Created At:</div>
                        <div class="col-md-9">
                            <i class="bi bi-calendar-check"></i>
                            <span th:text="${user.createdAt}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow mb-3">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0">Actions</h5>
                </div>
                <div class="card-body">
                    <div class="d-grid gap-2">
                        <a th:href="@{/admin/users/{id}/update(id=${user.id})}" class="btn btn-warning">
                            <i class="bi bi-pencil-fill"></i> Edit User
                        </a>
                        <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post">
                            <button type="submit"
                                    class="btn btn-danger w-100"
                                    onclick="return confirm('Are you sure you want to delete this user?')">
                                <i class="bi bi-trash-fill"></i> Delete User
                            </button>
                        </form>
                        <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Back to Users List
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
