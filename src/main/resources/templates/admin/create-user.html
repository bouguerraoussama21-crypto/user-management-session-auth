<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
  <title>Create User</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-5 mb-5">
  <div class="row mb-4">
    <div class="col-lg-12">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/admin/users}">Users</a></li>
          <li class="breadcrumb-item active" aria-current="page">Create User</li>
        </ol>
      </nav>
      <h1 class="display-6">
        <i class="bi bi-person-plus-fill"></i> Create New User
      </h1>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">User Information</h5>
        </div>
        <div class="card-body">

          <!-- Error messages -->
          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <form th:action="@{/admin/users/create}" th:object="${createUserDTO}" method="post">

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="username" class="form-label">
                  <i class="bi bi-person-fill"></i> Username *
                </label>
                <input type="text"
                       class="form-control"
                       id="username"
                       th:field="*{username}"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                       required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
              </div>

              <div class="col-md-6 mb-3">
                <label for="email" class="form-label">
                  <i class="bi bi-envelope-fill"></i> Email *
                </label>
                <input type="email"
                       class="form-control"
                       id="email"
                       th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                       required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="firstName" class="form-label">
                  <i class="bi bi-card-text"></i> First Name *
                </label>
                <input type="text"
                       class="form-control"
                       id="firstName"
                       th:field="*{firstName}"
                       required>
              </div>

              <div class="col-md-6 mb-3">
                <label for="lastName" class="form-label">
                  <i class="bi bi-card-text"></i> Last Name *
                </label>
                <input type="text"
                       class="form-control"
                       id="lastName"
                       th:field="*{lastName}"
                       required>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="password" class="form-label">
                  <i class="bi bi-key-fill"></i> Password *
                </label>
                <input type="password"
                       class="form-control"
                       id="password"
                       th:field="*{password}"
                       required>
                <small class="text-muted">Minimum 8 characters recommended</small>
              </div>

              <div class="col-md-6 mb-3">
                <label for="roleName" class="form-label">
                  <i class="bi bi-shield-fill-check"></i> Role *
                </label>
                <select class="form-select"
                        id="roleName"
                        th:field="*{roleName}"
                        required>
                  <option value="">-- Select Role --</option>
                  <option value="ROLE_USER">User</option>
                  <option value="ROLE_ADMIN">Admin</option>
                </select>
              </div>
            </div>

            <hr>

            <div class="d-flex justify-content-end gap-2">
              <a th:href="@{/admin/users}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancel
              </a>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle-fill"></i> Create User
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
