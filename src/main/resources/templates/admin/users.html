<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Users Management</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-5 mb-5">
    <div class="row mb-4">
        <div class="col-lg-12">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="display-6">
                    <i class="bi bi-people-fill"></i> Users Management
                </h1>
                <a th:href="@{/admin/users/create}" class="btn btn-primary">
                    <i class="bi bi-person-plus-fill"></i> Create New User
                </a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-12">
            <div class="card shadow">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Roles</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}"></td>
                                <td>
                                    <i class="bi bi-person-circle"></i>
                                    <span th:text="${user.userName}"></span>
                                </td>
                                <td th:text="${user.email}"></td>
                                <td th:text="${user.firstName}"></td>
                                <td th:text="${user.lastName}"></td>
                                <td>
                                    <span class="badge bg-primary" th:each="role : ${user.roles}" th:text="${role}"></span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/admin/users/{id}(id=${user.id})}"
                                           class="btn btn-sm btn-info text-white">
                                            <i class="bi bi-eye-fill"></i> View
                                        </a>
                                        <a th:href="@{/admin/users/{id}/update(id=${user.id})}"
                                           class="btn btn-sm btn-warning">
                                            <i class="bi bi-pencil-fill"></i> Edit
                                        </a>
                                        <form th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                                              method="post"
                                              style="display: inline;">
                                            <button type="submit"
                                                    class="btn btn-sm btn-danger"
                                                    onclick="return confirm('Are you sure you want to delete this user?')">
                                                <i class="bi bi-trash-fill"></i> Delete
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
