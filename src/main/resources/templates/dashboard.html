<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head}">
    <title>Dashboard</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-lg-12">
            <h1 class="display-5 mb-4">
                <i class="bi bi-speedometer2"></i> Dashboard
            </h1>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-lg-12">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="card-title">
                        <i class="bi bi-person-circle"></i> User Information
                    </h5>
                    <hr>
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Username:</strong> <span sec:authentication="name"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Roles:</strong> <span sec:authentication="principal.authorities"></span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6" sec:authorize="hasRole('ADMIN')">
            <div class="card shadow-sm border-primary">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-shield-fill-check"></i> Admin Panel
                    </h5>
                </div>
                <div class="card-body">
                    <p class="card-text">Manage users, roles, and system settings.</p>
                    <a th:href="@{/admin/users}" class="btn btn-primary">
                        <i class="bi bi-people-fill"></i> Manage Users
                    </a>
                    <a th:href="@{/admin/users/create}" class="btn btn-outline-primary ms-2">
                        <i class="bi bi-person-plus-fill"></i> Create User
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6" sec:authorize="hasRole('USER')">
            <div class="card shadow-sm border-success">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-person-fill"></i> User Panel
                    </h5>
                </div>
                <div class="card-body">
                    <p class="card-text">Access your personal information and settings.</p>
                    <button class="btn btn-success" >
                        <i class="bi bi-gear-fill"></i> My Profile
                    </button>
                    <a th:href="@{/user/change-password}" class="btn btn-outline-success ms-2">
                        <i class="bi bi-key-fill"></i> Change Password
                    </a>

                </div>
            </div>
        </div>

        <!-- Statistics Card -->
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="bi bi-bar-chart-fill"></i> Quick Stats
                    </h5>
                </div>
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-md-4">
                            <div class="p-3">
                                <i class="bi bi-calendar-check-fill text-primary" style="font-size: 2rem;"></i>
                                <h6 class="mt-2">Last Login</h6>
                                <p class="text-muted">Today</p>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3">
                                <i class="bi bi-shield-check text-success" style="font-size: 2rem;"></i>
                                <h6 class="mt-2">Account Status</h6>
                                <p class="text-muted">Active</p>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3">
                                <i class="bi bi-award-fill text-warning" style="font-size: 2rem;"></i>
                                <h6 class="mt-2">Your Role</h6>
                                <p class="text-muted" sec:authentication="principal.authorities"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
